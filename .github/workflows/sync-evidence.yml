name: Sync evidence contract

# Manual only (scheduled sync disabled 2026-11-26): the contract mirror must not
# commit evidence-engine outputs into the public repository without an explicit
# owner decision. Fetch the integration contract from api-service, validate it
# (JSON + schema_version), and commit the aggregate contract files into
# data/evidence/contract/. The atlas build fails loudly on a schema-version
# mismatch (scripts/build_site.py:check_contract_schema).
#
# Only aggregate contract files are mirrored (tier counts, network summary,
# review status, whats-new, network/docking status). species_publications.json
# (publication identifiers) is excluded and stays restricted. No abstracts,
# titles or other restricted engine inputs are fetched or committed.

on:
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

env:
  API_BASE: https://api-service-dyzfz7h7lq-uc.a.run.app
  EXPECTED_SCHEMA: "1.0"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and validate contract
        id: fetch
        run: python3 scripts/sync_evidence_contract.py

      - name: Commit mirrored contract
        run: |
          set -euo pipefail
          git config user.name  "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add data/evidence/contract
          if git diff --cached --quiet; then
            echo "no contract changes"
            exit 0
          fi
          ver=$(python3 -c "import json;print(json.load(open('data/evidence/contract/whats_new.json')).get('generated','contract'))")
          git commit -m "sync evidence contract v${ver}"
          git push

      - name: Open issue on validation failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Evidence contract sync failed',
              body: 'The daily evidence-contract sync failed validation or fetch. See the Actions run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            });